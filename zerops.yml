zerops:
  - setup: mailpit
    build:
      buildCommands:
        - sh download-mailpit.sh
      deployFiles: ./mailpit
    deploy:
      readinessCheck:
        httpGet:
          port: 8025
          path: /readyz
    run:
      base: alpine@3.24
      healthCheck:
        httpGet:
          port: 8025
          path: /livez
      ports:
        - port: 8025
          httpSupport: true
        - port: 1025
      start: ./mailpit
